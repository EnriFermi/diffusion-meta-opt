data:
  seed: 42
  log_level: INFO

logging:
  project_name: procedural_simple_vae
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

training_artifacts:
  base_root_dir: ./artifacts/procedural_simple_vae
  separate_run_dirs: true
  run_id: ""

model:
  variant: procedural_simple
  patch_size: 64
  beta: 0.001
  distribution:
    k_s: 64
    Kq: 128
    d_var: 256
    d_dist: 256
    num_var_attn_layers: 6
    var_attn_heads: 4
    dcn_num_cross_layers: 3
    dcn_deep_hidden: 128
    dcn_deep_layers: 3
    dropout: 0.0
    use_covariance: true
  mini_vae:
    z_dim: 64
    d_e: 128
    encoder_latent_dim: 0
    pos_lat_dim: 64
    pos_dim: 64
    num_attn_layers_encoder: 2
    num_layers_decoder: 2
    decoder_bilinear_rank: 0
    decoder_L_latents: 8
    decoder_use_dist_conditioning: true
    decoder_dist_mode: add
    use_latent_sampling: true
    implementation: real
    mlp_stub_hidden_dim: 256
    stub_mlp_use_batchnorm: false
    stub_resampler_d_model: 0
    init_style: llm
    n_heads: 1
    d_patch: 64
    dropout: 0.0
  big_vae:
    d_model: 512
    d_lat: 64
    num_latents: 64
    use_latent_sampling: false
    num_encoder_layers: 1
    num_decoder_layers: 2
    n_heads: 4
    ffn_mult: 4.0
    dropout: 0.0
    pos_fourier_dim: 256
    disable_z_shortcut: true
    disable_distribution_encoder: true
    latent_bottleneck_kind: ttm
    ttm:
      proc_tokens: 32
      process_depth: 2
      summarizer_mode: mlp
      summarizer_hidden_mult: 2.0
      num_blocks: 8
      share_weights: true
      dropout: 0.0
      use_type_embeddings: true
      use_positional_embeddings: true
      memory_init: learned
      return_aux: false
    encoder:
      self_attn_mode: full
      cross_attend_only_cls: false

train:
  device: cuda:0
  distributed: false
  num_gpus: 0
  backend: auto
  master_addr: "127.0.0.1"
  master_port: 0

  amp: false
  tf32: false
  cudnn_benchmark: false
  compile: false
  compile_mode: reduce-overhead
  compile_dynamic: true
  compile_disable_cudagraphs: true

  max_steps: 1000000
  grad_accum_steps: 1
  warmup_steps: 0
  min_lr_ratio: 0.01
  lr: 3e-5
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8
  grad_clip_norm: 0.0
  log_every: 10
  checkpoint_every: 500
  resume_checkpoint: ""

  kl_beta: 0.0
  behavioral_coef: 0.0
  structural_coef: 1.0
  struct_loss:
    gamma: 0.5
    lambda_scale: 0.0
    lambda_rec: 0.0
    lambda_dir: 1.0
    lambda_rel: 0.0
    huber_delta: 0.1

  synthetic:
    # X is also sampled from Normal to preserve the same operator loss API as big_vae train.
    batch_size: 16
    n_rows: 256
    d_in: 256
    d_out: 64
    x_std: 1.0
    w_std: 1.0
