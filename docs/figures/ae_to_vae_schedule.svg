<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">AE to VAE schedule</title>
  <desc id="desc">Cosine ramps for KL beta and latent sampling gate during AE to VAE fine tuning.</desc>
  <defs>
    <style>
      .bg { fill: #fbfbf8; }
      .axis { stroke: #1c2026; stroke-width: 2; }
      .grid { stroke: #cfd6dd; stroke-width: 1; }
      .beta { stroke: #1f77b4; stroke-width: 5; fill: none; }
      .gate { stroke: #d55e00; stroke-width: 5; fill: none; }
      .phase { fill: #ffffff; stroke: #252a31; stroke-width: 2; rx: 8; }
      .text { font-family: Inter, Arial, sans-serif; fill: #16191d; font-size: 23px; font-weight: 650; }
      .small { font-family: Inter, Arial, sans-serif; fill: #30343a; font-size: 17px; }
      .tiny { font-family: Inter, Arial, sans-serif; fill: #3f454d; font-size: 14px; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="520"/>
  <text x="64" y="58" class="text" style="font-size:32px">AE-to-VAE fine-tuning uses absolute-step schedules</text>
  <text x="64" y="90" class="small">Posterior noise and KL are introduced gradually after a deterministic AE checkpoint.</text>

  <line x1="120" y1="400" x2="1140" y2="400" class="axis"/>
  <line x1="120" y1="150" x2="120" y2="400" class="axis"/>
  <line x1="120" y1="320" x2="1140" y2="320" class="grid"/>
  <line x1="120" y1="240" x2="1140" y2="240" class="grid"/>
  <line x1="120" y1="160" x2="1140" y2="160" class="grid"/>
  <line x1="430" y1="135" x2="430" y2="420" stroke="#7f8790" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="760" y1="135" x2="760" y2="420" stroke="#7f8790" stroke-width="2" stroke-dasharray="8 8"/>

  <path d="M120 390 L430 390 C500 390 555 330 595 275 C645 205 700 160 760 160 L1140 160" class="beta"/>
  <path d="M120 392 L430 392 C500 392 555 335 595 282 C645 212 700 165 760 165 L1140 165" class="gate"/>

  <rect x="155" y="178" width="210" height="90" class="phase"/>
  <text x="180" y="213" class="text">AE region</text>
  <text x="180" y="242" class="small">KL near zero</text>
  <text x="180" y="264" class="tiny">posterior noise suppressed</text>

  <rect x="485" y="178" width="220" height="90" class="phase"/>
  <text x="510" y="213" class="text">Ramp</text>
  <text x="510" y="242" class="small">cosine schedule</text>
  <text x="510" y="264" class="tiny">stable migration</text>

  <rect x="835" y="178" width="230" height="90" class="phase"/>
  <text x="860" y="213" class="text">VAE region</text>
  <text x="860" y="242" class="small">full sampling gate</text>
  <text x="860" y="264" class="tiny">KL target beta active</text>

  <circle cx="930" cy="347" r="7" fill="#1f77b4"/>
  <text x="948" y="353" class="small">KL beta</text>
  <circle cx="930" cy="377" r="7" fill="#d55e00"/>
  <text x="948" y="383" class="small">latent sampling gate</text>

  <text x="105" y="432" class="tiny">0</text>
  <text x="388" y="438" class="tiny">warmup</text>
  <text x="715" y="438" class="tiny">warmup + ramp</text>
  <text x="1102" y="438" class="tiny">global step</text>
</svg>
