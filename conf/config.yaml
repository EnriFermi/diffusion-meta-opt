defaults:
  - data: test_dataset
  - data/collector: interleaved
  - data/streaming: none
  - train: default
  - model: weight_quantile_vae
  - _self_

hf:
  token: "YOUR_HF_TOKEN_HERE"
  hf_home: ${data.path}/hf_home
  datasets_cache: ${data.path}/hf_datasets_cache
  hub_cache: ${data.path}/hf_hub_cache

hydra:
  job:
    name: train
  run:
    dir: .
  output_subdir: null

logging:
  project_name: diffusion_meta_opt
  dir: logs
  file_name: ${logging.project_name}_${hydra:job.name}_${now:%Y-%m-%d_%H-%M-%S}.log
  file_path: ${logging.dir}/${logging.file_name}
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

models:
  enabled: []
  model_config_dirs:
    - conf/data/models
