max_steps: 1000000
grad_accum_steps: 5
distributed: true
num_gpus: 2
compile: true
compile_dynamic: true
# Keep torch.compile while avoiding inductor CUDAGraph output-buffer reuse issues.
compile_disable_cudagraphs: true

warmup_steps: 10000
min_lr_ratio: 0.01
kl_beta: 0.05
lr: 5e-4

behavioral_coef: 0.1
structural_coef: 2.0
contrastive_coef: 0.0

checkpoint_every: 500
checkpoint_dir: ${training_artifacts.big_vae_checkpoint_dir}

stage: 1
stage_base_T_patches: 8
stage_base_d_out: 32
stage_scale_factor: 2
steps_per_sample: 10
slice_batch_size: 4
resume_checkpoint: ""

forensics:
  stdio_redirect: false

telemetry:
  comet:
    enabled: true
    api_key: ${oc.env:COMET_API_KEY,""}
    workspace: ${oc.env:COMET_WORKSPACE,""}
    project_name: big_weight_vae
    experiment_name: ""
    tags: []
    offline_directory: ""
    log_code: false
