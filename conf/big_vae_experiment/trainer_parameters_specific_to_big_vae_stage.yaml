max_steps: 1000000
grad_accum_steps: 5
distributed: true
num_gpus: 2
compile: true
compile_dynamic: true

warmup_steps: 10000
min_lr_ratio: 0.01
kl_beta: 0.05
lr: 5e-4

behavioral_coef: 0.1
structural_coef: 2.0
contrastive_coef: 0.0

checkpoint_every: 500
checkpoint_dir: ${training_artifacts.big_vae_checkpoint_dir}

stage: 1
stage_base_T_patches: 8
stage_base_d_out: 32
stage_scale_factor: 2
steps_per_sample: 10
slice_batch_size: 4
resume_checkpoint: ""
