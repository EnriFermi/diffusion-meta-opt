patch_size: 64
beta: 0.001

big_vae:
  d_model: 512
  d_lat: 256
  num_latents: 32
  # true -> VAE (sampling + KL), false -> AE (deterministic z, KL term forced to 0 in train loop)
  use_latent_sampling: true
  num_encoder_layers: 8
  num_decoder_layers: 8
  n_heads: 8
  ffn_mult: 4.0
  dropout: 0.1
  pos_fourier_dim: 64
  encoder:
    self_attn_mode: full
    cross_attend_only_cls: false
