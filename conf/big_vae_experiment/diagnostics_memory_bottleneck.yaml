# @package _global_
defaults:
  - /run_profiles@_global_: train_big_vae
  - _self_

train:
  distributed: false
  num_gpus: 1
  device: "cuda:0"
  amp: false
  compile: false
  compile_dynamic: false
  compile_disable_cudagraphs: false
  tf32: false
  cudnn_benchmark: false
  weight_decay: 0.0
  grad_clip_norm: 0.0
  grad_clip_norm_by_part: {}
  behavioral_coef: 0.0
  structural_coef: 1.0
  fixed_training_batch:
    enabled: true
  synthetic_layer_source:
    enabled: false
  telemetry:
    grad_layer_monitor:
      enabled: false
    comet:
      enabled: false
  struct_loss:
    gamma: 0.5
    lambda_dir: 1.0
    lambda_scale: 0.0
    lambda_rec: 0.0
    lambda_rel: 0.0
    huber_delta: 0.1
  slice_batch_size: 16

model:
  distribution:
    dropout: 0.0
  mini_vae:
    dropout: 0.0
  big_vae:
    dropout: 0.0
    use_latent_sampling: false

diagnostics:
  seed: 1234
  checkpoint_path: ${train.resume_checkpoint}
  output_root: artifacts/big_vae_memory_bottleneck_diagnostics
  frozen_pair:
    source_kind: real
    source_batch_size: 16
    max_x_rows: ${train.max_x_rows}
    use_curriculum_slice: true
    max_T_patches: null
    max_d_out: null
    exact_fixed_batch_paths:
      duplicate_pair: ""
      different_pair: ""
  training:
    steps: 2000
    lr: ${train.lr}
  reporting:
    convergence_threshold: 0.01
    ratio_alert: 5.0
    ratio_eps: 1.0e-12
    impossible_pair_eps: 1.0e-6

hydra:
  job:
    name: diagnose_big_vae_memory_bottleneck
    chdir: false
