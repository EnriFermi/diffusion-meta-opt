# @package _global_
defaults:
  - /shared_runtime_environment: checkpoint_and_artifact_paths_for_mini_then_big
  - /data_collection_runtime/data_profiles@data: data_profile_for_mini_vae_training
  - /data_collection_runtime/collector_profiles@collector: collector_profile_async_gpu1
  - /data_collection_runtime/streaming_profiles@streaming: streaming_profile_local_disk_gpu_parallel

  - /shared_training_parameters@mini_train: trainer_execution_common
  - /mini_vae_experiment@mini_train: trainer_parameters_specific_to_mini_vae_stage

  - /shared_training_parameters@mini_model: model_backbone_distribution_and_mini_vae
  - /mini_vae_experiment@mini_model: model_parameters_specific_to_mini_vae_stage

  - _self_

hydra:
  job:
    name: train_mini_vae

# Stability overrides for expanded mini-VAE train split.
# Keep async collector, but reduce peak pressure to avoid collector SIGKILL/OOM.
collector:
  jobs_per_selected_model: 1
  num_inflight_jobs: 1
  release_device_on_unload: true
  empty_cuda_cache_on_unload: true
  diagnostics:
    crash_report_enabled: true
    crash_report_path: ${oc.select:training_artifacts.crashes_dir,./data/reports}/collector_crash_report_train_mini_vae.json
  layer_output_splitting:
    xy_samples_random_slice: 256

streaming:
  chunk_size_samples: 32
  producer:
    ready_store_max_chunks: 200
    refill_after_consumed_chunks: 100
