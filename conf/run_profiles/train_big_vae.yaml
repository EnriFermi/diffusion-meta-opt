# @package _global_
defaults:
  - /shared_runtime_environment: checkpoint_and_artifact_paths_for_mini_then_big
  - /data_collection_runtime/data_profiles@data: data_profile_for_big_vae_training
  - /data_collection_runtime/collector_profiles@collector: collector_profile_async_gpu1
  - /data_collection_runtime/streaming_profiles@streaming: streaming_profile_none

  - /shared_training_parameters@train: trainer_execution_common
  - /big_vae_experiment@train: trainer_parameters_specific_to_big_vae_stage

  - /shared_training_parameters@model: model_backbone_distribution_and_mini_vae
  - /big_vae_experiment@model: model_parameters_specific_to_big_vae_stage

  - _self_

# BigVAE speed tuning: fewer model switches + lighter per-layer x/y payload.
collector:
  jobs_per_selected_model: 8
  layer_output_splitting:
    xy_samples_random_slice: 256

hydra:
  job:
    name: train_big_vae
