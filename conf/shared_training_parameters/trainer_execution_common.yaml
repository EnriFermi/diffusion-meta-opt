device: "cuda:0"
distributed: auto
num_gpus: 0
backend: auto
master_addr: "127.0.0.1"
master_port: 0
use_dataset_sharding: true

predownload_models: false
max_x_rows: 512

lr: 0.0003
weight_decay: 0.1
betas: [0.9, 0.999]
eps: 0.00000001
grad_clip_norm: 1.0

amp: true
compile: true
compile_mode: max-autotune
tf32: true
cudnn_benchmark: true

log_every: 10

forensics:
  enabled: true
  stdio_redirect: true
  enable_core_dumps: true
  heartbeat_steps: 10
  monitor_enabled: true
  monitor_poll_s: 1.0
  monitor_max_children: 16
  monitor_queue_max_items: 8192
  nccl:
    enabled: true
    trace_buffer_size: 1048576
    dump_on_timeout: true
    async_error_handling: true
