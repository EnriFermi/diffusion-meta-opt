patch_size: 64

distribution:
  num_var_attn_layers: 3
  var_attn_heads: 8
  dcn_deep_hidden: 128
  dcn_deep_layers: 2
  dropout: 0.05

mini_vae:
  implementation: mlp_stub
  z_dim: 32
  decoder_bilinear_rank: 16
  d_e: 256
  mlp_stub_hidden_dim: 256
  stub_resampler_d_model: 0  # 0 => use d_e
  use_latent_sampling: false
  num_attn_layers_encoder: 3
  num_layers_decoder: 3
  n_heads: 8
  dropout: 0.05
