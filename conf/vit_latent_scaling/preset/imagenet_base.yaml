# @package _global_

vit_latent_scaling:
  dataset: imagenet
  model_size: base
  data_dir: ${oc.env:IMAGENET_DATA_DIR,./data/imagenet}
  download: false
  epochs: 90
  max_steps: 50000
  batch_size: 64
  eval_batch_size: 128
  num_workers: 8
  eval_every_steps: 2500
vit_model:
  image_size: 224
  patch_size: 16
  in_channels: 3
  num_classes: 1000
  hidden_dim: 768
  depth: 12
  num_heads: 12
  mlp_ratio: 4.0
