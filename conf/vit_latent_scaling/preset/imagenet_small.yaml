# @package _global_

vit_latent_scaling:
  dataset: imagenet
  model_size: small
  data_dir: ${oc.env:IMAGENET_DATA_DIR,./data/imagenet}
  download: false
  epochs: 90
  max_steps: 30000
  batch_size: 96
  eval_batch_size: 192
  num_workers: 8
  eval_every_steps: 1500
vit_model:
  image_size: 224
  patch_size: 16
  in_channels: 3
  num_classes: 1000
  hidden_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
