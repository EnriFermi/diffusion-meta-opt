# @package _global_

vit_latent_scaling:
  dataset: cifar10
  model_size: mili
  data_dir: ${oc.env:CIFAR10_DATA_DIR,./data/cifar10}
  epochs: 30
  max_steps: 3000
  batch_size: 256
  eval_batch_size: 512
  num_workers: 4
  eval_every_steps: 150
vit_model:
  image_size: 32
  patch_size: 4
  in_channels: 3
  num_classes: 10
  hidden_dim: 128
  depth: 3
  num_heads: 4
  mlp_ratio: 4.0
