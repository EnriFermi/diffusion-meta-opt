hydra:
  run:
    dir: .
  output_subdir: null
  job:
    name: vit_latent_scaling

experiment:
  profile: cifar10_50k
  run_label: ""
  notes: ""
  tags: []

storage:
  root_dir: ./post_train_research/vit_latent_scaling/artifacts
  shared_checkpoint_root_dir: ""
  shared_checkpoint_label: ""
  checkpoint_every_steps: 250
  save_best: true
  save_latest: true
  save_final: true

data:
  data_dir: ""
  dataset: ""
  download: true
  train_subset: 0
  test_subset: 0
  batch_size: 0
  eval_batch_size: 0
  num_workers: 4

model:
  image_size: 0
  patch_size: 0
  in_channels: 0
  num_classes: 0
  hidden_dim: 0
  depth: 0
  num_heads: 0
  mlp_ratio: 0.0
  dropout: 0.0
  attention_dropout: 0.0

setup:
  kind: latent
  big_vae_checkpoint: ""
  big_vae_decode: weights
  big_vae_tile_T_patches: 4
  big_vae_tile_d_out: 64
  big_vae_latent_parameterization: sphere
  big_vae_latent_noise_std: 0.0

init:
  kind: diffusion_prior
  fresh_latent_mode: random
  random_init_std: 0.02
  source_run_dir: ""
  source_checkpoint: best
  source_prefer_direct_latent: true
  diffusion_prior_checkpoint: ""
  diffusion_prior_steps: 50
  diffusion_prior_sampler: ddim
  diffusion_prior_eta: 0.0
  calibration_batches: 1

train:
  device: ${oc.env:DEVICE,auto}
  seed: 42
  epochs: 1000
  max_steps: 3000
  optimizer_name: AdamW
  optimizer_kwargs: {}
  lr: 1e-3
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1e-9
  grad_clip_norm: 0.0
  label_smoothing: 0.0
  amp: true
  tf32: true
  compile: false
  latent_lr_scheduler: constant
  latent_lr_floor_ratio: 0.1
  latent_lr_decay_steps: 0

logging:
  log_every_steps: 50
  eval_every_steps: 150
  latent_debug_metrics: true
  latent_jacobian_eps: 1e-3
  latent_jacobian_probes: 16

telemetry:
  comet:
    enabled: false
    api_key: ${oc.env:COMET_API_KEY,""}
    workspace: ${oc.env:COMET_WORKSPACE,""}
    project_name: vit_latent_scaling
    experiment_name: ""
    offline_directory: ""
    log_code: false
    tags: []
