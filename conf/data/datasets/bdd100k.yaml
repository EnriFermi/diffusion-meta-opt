name: bdd100k
enabled: true
gated: false
sampling_weight: 1.0
models:
  - dinov2_base
collector_device: null

hf:
  repo: dgural/bdd100k
  subset: null
  split: train
  streaming: false
  shuffle_buffer: 10000
  trust_remote_code: false

schema:
  image_mode: image_field
  image_field: image
  image_field_candidates: [image, img]
  url_field: null
  url_field_candidates: []
  id_field: name
  extra_fields: []

cache:
  num_chunks_kept: 2
  chunk_size_images: 256
  prefetch_low_watermark: 1

worker:
  idle_sleep_s: 0.5
  get_timeout_s: 5.0
  request_timeout_s: 10
  max_retries: 2
  max_worker_restarts: 5

licensing_note: "Use according to BDD100K terms and HF repository card."
