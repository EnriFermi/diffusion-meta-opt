name: doclaynet_v11
description: "Страницы документов с layout-аннотациями; задача document layout analysis."
enabled: true
gated: false
sampling_weight: 1.0
models:
  - donut_base
  - trocr_base_printed
  - blip_image_captioning_base
  - clip_vit_b32
  - swinv2_base
collector_device: null

hf:
  repo: docling-project/DocLayNet-v1.1
  subset: null
  split: train
  streaming: true
  shuffle_buffer: 50000
  trust_remote_code: false

schema:
  image_mode: image_field
  image_field: image
  image_field_candidates: [image, img, pixel_values, jpg, png]
  url_field: null
  url_field_candidates: []
  id_field: null
  extra_fields: [bboxes, category_id, segmentation, area, metadata, pdf_cells]

cache:
  num_chunks_kept: 2
  chunk_size_images: 256

worker:
  idle_sleep_s: 0.5
  get_timeout_s: 5.0
  request_timeout_s: 10
  max_retries: 2
  max_worker_restarts: 5

licensing_note: "License: other (see dataset card)."
