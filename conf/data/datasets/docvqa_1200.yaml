name: docvqa_1200
description: "Документные изображения с вопросами/ответами; задача Document VQA."
enabled: true
gated: false
sampling_weight: 1.0
models:
  - donut_base
  - trocr_base_printed
  - clip_vit_b32
  - blip_image_captioning_base
  - deit_base
collector_device: null

hf:
  repo: nielsr/docvqa_1200_examples
  subset: null
  split: train
  streaming: false
  shuffle_buffer: 1000
  trust_remote_code: false

schema:
  image_mode: image_field
  image_field: image
  image_field_candidates: [image, img, pixel_values, jpg, png]
  url_field: null
  url_field_candidates: []
  id_field: id
  extra_fields: [query, answers, words, bounding_boxes, answer]

cache:
  num_chunks_kept: 2
  chunk_size_images: 256

worker:
  idle_sleep_s: 0.5
  get_timeout_s: 5.0
  request_timeout_s: 10
  max_retries: 2
  max_worker_restarts: 5

licensing_note: "License unclear; see dataset card."
