name: oxford_pets
description: "Фото кошек и собак; задачи классификации пород и pet segmentation."
enabled: true
gated: false
sampling_weight: 1.0
models:
  - clip_vit_b32
  - siglip_base_p16_384
  - dinov2_base
  - deit_base
  - mask2former_swin_base
collector_device: null

hf:
  repo: cvdl/oxford-pets
  subset: null
  split: train
  streaming: true
  shuffle_buffer: 1000
  trust_remote_code: false
  stream_via_datasets_server: false

schema:
  image_mode: image_field
  image_field: img
  image_field_candidates: [img, image, pixel_values, jpg, png]
  url_field: null
  url_field_candidates: []
  id_field: null
  extra_fields: [bbox, class, category]

cache:
  num_chunks_kept: 2
  chunk_size_images: 256

worker:
  idle_sleep_s: 0.5
  get_timeout_s: 5.0
  request_timeout_s: 10
  max_retries: 2
  max_worker_restarts: 5

licensing_note: "License unclear; see dataset card."
