name: food101
description: "Изображения еды; задача классификации кулинарных категорий."
enabled: true
gated: false
sampling_weight: 1.0
models:
  - siglip_so400m_p14_384
  - vit_large_p16_224
collector_device: null

hf:
  repo: ethz/food101
  subset: null
  split: train
  streaming: false
  shuffle_buffer: 1000
  trust_remote_code: false

schema:
  image_mode: image_field
  image_field: image
  image_field_candidates: [image, img, pixel_values, jpg, png]
  url_field: null
  url_field_candidates: []
  id_field: null
  extra_fields: [label]

cache:
  num_chunks_kept: 2
  chunk_size_images: 256

worker:
  idle_sleep_s: 0.5
  get_timeout_s: 5.0
  request_timeout_s: 10
  max_retries: 2
  max_worker_restarts: 5

licensing_note: "Use according to Food-101 / HF dataset card terms."
