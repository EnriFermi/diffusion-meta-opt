name: openimages_v7
description: "Open Images V7 URLs with labels; large-scale detection/classification source."
enabled: true
gated: false
sampling_weight: 1.0
models:
  - detr_resnet50
  - clip_vit_l14
collector_device: null

hf:
  repo: bitmind/open-images-v7
  subset: null
  split: train
  streaming: true
  shuffle_buffer: 10000
  trust_remote_code: false

schema:
  image_mode: url_field
  image_field: null
  image_field_candidates: []
  url_field: url
  url_field_candidates: [url, image_url, imageURL]
  id_field: image_id
  extra_fields: [labels]

cache:
  num_chunks_kept: 2
  chunk_size_images: 256

worker:
  idle_sleep_s: 0.5
  get_timeout_s: 5.0
  request_timeout_s: 10
  max_retries: 2
  max_worker_restarts: 5

licensing_note: "Respect Open Images V7 licensing and source URL availability constraints."
