name: visual_genome
enabled: true
gated: false
sampling_weight: 1.0
models:
  - clip_vit_b32
collector_device: null

hf:
  repo: ranjaykrishna/visual_genome
  subset: null
  split: train
  streaming: true
  shuffle_buffer: 10000
  trust_remote_code: true

schema:
  image_mode: url_field
  image_field: null
  image_field_candidates: []
  url_field: url
  url_field_candidates: [url, image_url, imageURL]
  id_field: image_id
  extra_fields: [caption, region_descriptions]

cache:
  num_chunks_kept: 2
  chunk_size_images: 256
  prefetch_low_watermark: 1

worker:
  idle_sleep_s: 0.5
  get_timeout_s: 5.0
  request_timeout_s: 10
  max_retries: 2
  max_worker_restarts: 5

licensing_note: "Requires trust_remote_code and Visual Genome licensing compliance."
