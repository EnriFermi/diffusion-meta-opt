# @package _global_
collector:
  enabled: true
  device: null
  mode: auto
  max_loaded_models: 1
  pin_gpu: false
  release_device_on_unload: true
  empty_cuda_cache_on_unload: true
  model_policy: shuffled_cycle
  model_burst_jobs: 2
  dataset_mix_policy: multinomial
  mix_cap_per_dataset: 0.6
  num_inflight_jobs: 1
  cache:
    max_items: 3000
    fill_target: 3000
    low_watermark: 1500
  interleaved:
    every_n_steps: 30
    burst_jobs: 1
    max_collect_share: 0.15
  atomization:
    atom_mode: chunk
    chunk_rows: 256
