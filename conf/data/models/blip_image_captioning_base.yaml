name: blip_image_captioning_base
provider: transformers
runner: hf_encdec_runner
model_family: blip
architecture: blip
hf_repo: Salesforce/blip-image-captioning-base
revision: null
gated: false
cache_subdir: models/${.name}
batch_size: 16
sampling_weight: 1.0
device: auto
dtype: float16
run_mode: vision_encoder_only
hook_filter:
  include_regex: "^vision_model\\."
  exclude_regex: null
limits:
  max_records_per_layer: 200000
  max_layers: null
preprocess:
  processor: auto
trust_remote_code: false
