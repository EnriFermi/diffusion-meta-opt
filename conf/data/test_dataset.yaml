# Raw dataset profile for shared orchestrator.
# Create additional profiles next to this file:
#   conf/data/<your_profile>.yaml
# and select them via defaults in conf/config.yaml.

path: ${oc.env:DATA_ROOT,./data/datasets}
seed: 42
output_format: pil  # tensor | pil
image_size: 224
log_level: INFO
max_loaded_models: 1

dataset_config_dirs:
  - conf/data/datasets

enabled_datasets:
  - bdd100k
  - cc12m
  - coco2017
  - mapillary_vistas_v2
  - relaion400m
  - scene_parse_150
  - visual_genome
  - stanford_cars
  - dtd_textures
  - eurosat_rgb
  - patchcamelyon
  - oxford_pets
  - wider_face
  - doclaynet_v11
  - cord_v2
  - funsd
  - docvqa_1200

# Per-profile focused overrides.
# Example:
# dataset_overrides:
#   flickr30k:
#     models: [clip_vit_b32, dinov2_base]
#   coco2017:
#     sampling_weight: 0.7
dataset_overrides: {}
