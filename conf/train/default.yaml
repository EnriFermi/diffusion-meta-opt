device: "cuda:0"
distributed: auto
num_gpus: 0
backend: auto
master_addr: "127.0.0.1"
master_port: 0
use_dataset_sharding: true

predownload_models: false
max_steps: 1000
grad_accum_steps: 1
max_x_rows: 512

lr: 0.0003
weight_decay: 0.01
betas: [0.9, 0.95]
eps: 0.00000001
warmup_steps: 100
min_lr_ratio: 0.1
kl_beta: 0.001
grad_clip_norm: 1.0

amp: auto
compile: false
compile_mode: max-autotune
tf32: true
cudnn_benchmark: true

log_every: 10
checkpoint_every: 200
checkpoint_dir: ./checkpoints/weight_quantile_vae
