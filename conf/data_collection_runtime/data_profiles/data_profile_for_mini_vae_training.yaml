defaults:
  - data_profile_common_settings
  - _self_

path: ${oc.env:DATA_ROOT,./data}

enabled_datasets:
  # Mini-VAE train split.
  - cc12m
  - bdd100k
  - scene_parse_150
  - doclaynet_v11
  - patchcamelyon
  - eurosat_rgb
  - stanford_cars

dataset_overrides:
  bdd100k:
    models:
      - clip_vit_b32
      - deit_base
      - dinov2_base
      - swinv2_base
    hf:
      stream_via_datasets_server: false
    cache:
      chunk_size_images: 128
      num_chunks_kept: 3
  stanford_cars:
    models:
      - clip_vit_b32
      - siglip_base_p16_384
      - dinov2_base
      - deit_base
      - beit_base
    cache:
      chunk_size_images: 128
      num_chunks_kept: 3

cli:
  batch_size: 8
  num_batches: 1
