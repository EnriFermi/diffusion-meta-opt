defaults:
  - data_profile_common_settings
  - _self_

path: ${oc.env:DATA_ROOT,./data}

enabled_datasets:
  # Temporary isolation mode for debugging collector/training stability.
  # Keep a single dataset to reduce runtime variability.
  - bdd100k

dataset_overrides:
  # Keep mini-train profile on datasets with materialized image fields
  # (instead of brittle external URL-only corpora like cc12m/visual_genome).
  bdd100k:
    models:
      - clip_vit_b32
      - deit_base
      - dinov2_base
      - swinv2_base
    hf:
      stream_via_datasets_server: true
    cache:
      chunk_size_images: 128
      num_chunks_kept: 3
  oxford_pets:
    models:
      - clip_vit_b32
      - siglip_base_p16_384
      - dinov2_base
      - deit_base
    cache:
      chunk_size_images: 128
      num_chunks_kept: 3
  stanford_cars:
    models:
      - clip_vit_b32
      - siglip_base_p16_384
      - dinov2_base
      - deit_base
      - beit_base
    cache:
      chunk_size_images: 128
      num_chunks_kept: 3

cli:
  batch_size: 8
  num_batches: 1
