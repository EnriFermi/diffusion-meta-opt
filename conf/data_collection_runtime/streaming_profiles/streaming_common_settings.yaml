mode: none

chunk_size_samples: 256
chunk_format:
  # Supported values:
  # - none: no compression (.pt)
  # - gzip: gzip compression (.pt.gz)
  compression: none

producer:
  spool_dir: ${data.path}/streaming/spool/producer
  max_pending_spool_chunks: 64
  ready_store_dir: ${data.path}/streaming/local_disk
  ready_store_max_chunks: 200
  refill_after_consumed_chunks: 100
  stripe_window_chunks: null

consumer:
  cache_dir: ${data.path}/streaming/cache/consumer
  prefetch_max_chunks: 16
  delete_remote_after: consume
  randomize_within_chunk: true
  random_seed: null

s3:
  bucket: ""
  prefix: diffusion-meta-opt/streaming
  region: null
  endpoint_url: null
  max_remote_chunks: 1000
  staging_prefix: staging
  ready_prefix: ready

distributed:
  enabled: true
  rank_env: RANK
  world_size_env: WORLD_SIZE
  shard_by: chunk
