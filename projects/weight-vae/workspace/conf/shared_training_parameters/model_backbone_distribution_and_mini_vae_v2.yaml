distribution:
  k_s: 64
  Kq: 128
  d_var: 32
  d_dist: 32
  num_var_attn_layers: 2
  var_attn_heads: 2
  dcn_num_cross_layers: 1
  dcn_deep_hidden: 32
  dcn_deep_layers: 1
  dropout: 0.0
  use_covariance: true
  # Keep covariance encoder input width aligned with the active model patch size.
  patch_size_for_cov: ${..patch_size}

mini_vae:
  z_dim: 64
  d_e: 128
  pos_dim: 32
  num_attn_layers_encoder: 2
  num_layers_decoder: 2
  n_heads: 4
  d_patch: 64
  dropout: 0.0
  mlp_stub_hidden_dim: 256
