defaults:
  - config
  - _self_

benchmark:
  run_label: adamw_smoke

tasks:
  preset: custom
  enabled:
    - ImageMLP_FashionMnist_Relu128x128

evaluation:
  steps: 2000
  seeds: [0]
  eval_every: 10
  eval_batches: 5
  last_eval_batches: 10
  metrics_every: 10

adam_reference:
  enabled: true
  lrs: [1e-7, 3e-7, 1e-6, 3e-6, 1e-5, 3e-5, 1e-4, 3e-4, 1e-3, 3e-3, 1e-2, 3e-2, 1e-1, 3e-1, 1.0]

methods:
  items:
    - name: adamw_lr_1e-3_wd_1e-4
      kind: adamw
      metadata:
        lr: 1e-3
        weight_decay: 1e-4
        b1: 0.9
        b2: 0.999
        eps: 1e-8
        eps_root: 0.0
