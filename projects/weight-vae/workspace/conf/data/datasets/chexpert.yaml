name: chexpert
description: "Chest X-ray classification (grayscale source; decoded as RGB for model runners)."
enabled: true
gated: false
sampling_weight: 1.0
models:
  - vit_large_p16_224
  - clip_vit_l14
collector_device: null

hf:
  repo: danjacobellis/chexpert
  subset: null
  split: train
  streaming: true
  shuffle_buffer: 1000
  trust_remote_code: false

schema:
  image_mode: image_field
  image_field: image
  image_field_candidates: [image, img, pixel_values, jpg, png]
  url_field: null
  url_field_candidates: []
  id_field: path
  extra_fields: [sex, age, frontal]

cache:
  num_chunks_kept: 2
  chunk_size_images: 256

worker:
  idle_sleep_s: 0.5
  get_timeout_s: 5.0
  request_timeout_s: 10
  max_retries: 2
  max_worker_restarts: 5

licensing_note: "CheXpert images are grayscale; runtime decode converts all images to RGB via PIL.convert('RGB')."
